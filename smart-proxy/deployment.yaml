apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-proxy-config
  namespace: default
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 9000;
            server_name _;
            
            # Route API calls to correct backend services based on path
            location /api/auth/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/Conductor/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/Participant/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/SurveyProxy/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/email/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/surveys {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/answers {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            location /api/participant/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "participants-management-service.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
            
            # Default: everything else goes to frontend
            location / {
                proxy_pass http://kourier.kourier-system.svc.cluster.local:80;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "frontend.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-proxy
  template:
    metadata:
      labels:
        app: smart-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 9000
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: smart-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: smart-proxy
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: http
  selector:
    app: smart-proxy

