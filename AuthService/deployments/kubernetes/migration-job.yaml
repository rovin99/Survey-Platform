apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migration
  namespace: default
  labels:
    app: auth-service
    component: migration
spec:
  template:
    metadata:
      labels:
        app: auth-service
        component: migration
    spec:
      containers:
      - name: migrator
        # Use the migrations-specific image with EF tools
        image: rovin123/auth-service-migrations:v1
        
        # Override entrypoint to run migrations
        command: 
        - /bin/sh
        - -c
        - |
          dotnet ef database update --connection "$ConnectionStrings__DefaultConnection"
        
        # Load environment variables from ConfigMap and Secret
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: CONNECTION_STRING
        envFrom:
          - configMapRef:
              name: auth-service-config
          - secretRef:
              name: auth-service-secrets
        
        # Resource limits for the migration job
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
            
      restartPolicy: OnFailure
        
  # Retry policy
  backoffLimit: 3
  ttlSecondsAfterFinished: 300  # Clean up job after 5 minutes 