apiVersion: v1
kind: Secret
metadata:
  name: participants-service-secrets
  namespace: default
  labels:
    app: participants-management-service
type: Opaque
stringData:
  # Database Credentials (SENSITIVE)
  # Replace these values with actual secrets from your secret management system
  # DO NOT commit actual secrets to version control
  DB_USER: "${POSTGRES_USER}"
  DB_PASSWORD: "${POSTGRES_PASSWORD}"

  # JWT Secret Key (SENSITIVE) - Must match AuthService JWT key for validation
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"  # Must be at least 256 bits (32 characters) for HS256

  # Internal API Key (SENSITIVE) - For service-to-service communication
  # Must match the key configured in SurveyManagementService
  INTERNAL_API_KEY: "${INTERNAL_API_KEY}"

  # MinIO Object Storage Credentials (SENSITIVE)
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"

