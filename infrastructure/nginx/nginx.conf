events {
    worker_connections 1024;
}

http {
    # Rate limit zone for Piston code execution: 5 requests/min per IP
    limit_req_zone $binary_remote_addr zone=piston_limit:10m rate=5r/m;

    # Upstream definitions
    upstream frontend {
        server frontend:3000;
    }

    upstream auth_service {
        server auth-service:5000;
    }

    upstream survey_service {
        server survey-service:8080;
    }

    upstream participants_service {
        server participants-service:8081;
    }

    upstream piston {
        server piston:2000;
    }

    upstream minio {
        server minio:9000;
    }

    server {
        listen 80;
        server_name localhost;

        # Allow file uploads up to 6MB
        client_max_body_size 6m;

        # Increase buffer sizes for large headers (JWT tokens)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Proxy uploaded media files to MinIO object storage
        location /uploads/ {
            proxy_pass http://minio/survey-uploads/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        # AuthService routes
        location /api/auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;
        }

        location /api/Conductor {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /api/Participant {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        # SurveyManagementService routes
        location /api/surveys {
            proxy_pass http://survey_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header User-Agent $http_user_agent;
        }

        location /api/v1 {
            proxy_pass http://survey_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header User-Agent $http_user_agent;
            proxy_pass_header Set-Cookie;
        }

        location /api/answers {
            proxy_pass http://survey_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/email {
            proxy_pass http://survey_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ParticipantsManagementService routes
        location /api/participant {
            proxy_pass http://participants_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header User-Agent $http_user_agent;
            proxy_pass_header Set-Cookie;
        }

        # Piston Code Execution Engine (rate limited — protects against abuse)
        location /api/piston/ {
            # Rate limit: 5 requests/min per IP, burst of 3 (allows quick test runs)
            # This is the primary protection — works for both authenticated and anonymous users
            limit_req zone=piston_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://piston/api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeout for code execution
            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
        }

        # Frontend - catch all
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Next.js hot reload (dev mode)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

