name: SurveyManagementService CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'SurveyManagementService/**'
      - '.github/workflows/survey-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'SurveyManagementService/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/survey-service

jobs:
  test:
    name: Test & Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SurveyManagementService
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: SurveyManagementService/go.sum

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: SurveyManagementService
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... || echo "No tests found, creating empty coverage"
          if [ ! -f coverage.out ]; then
            echo "mode: atomic" > coverage.out
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.out || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./SurveyManagementService/coverage.out
          flags: surveyservice
          name: codecov-surveyservice
          fail_ci_if_error: false

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './SurveyManagementService'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Docker Image
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    # Build/push only on PRs and develop; the deploy workflows build the canonical image on main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./SurveyManagementService
          file: ./SurveyManagementService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  notify:
    name: Notify Build Status
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ]; then
            echo "✅ SurveyManagementService CI passed"
          else
            echo "❌ SurveyManagementService CI failed"
          fi
