# App services as plain Deployments + ClusterIP Services (no Knative).
# Service names + ports match infrastructure/nginx/nginx.conf upstreams so the gateway works as-is.
# __REGISTRY__ is replaced by deploy-k3s.sh (e.g. docker.io/rovin123).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
      - name: auth-service
        image: __REGISTRY__/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 5000 }]
        envFrom:
        - configMapRef: { name: auth-service-config }
        - secretRef: { name: auth-service-secrets }
        resources:
          requests: { memory: "192Mi", cpu: "100m" }
          limits: { memory: "448Mi", cpu: "1000m" }
        readinessProbe: { httpGet: { path: /health/ready, port: 5000 }, initialDelaySeconds: 10, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /health/live,  port: 5000 }, initialDelaySeconds: 30, periodSeconds: 15 }
        startupProbe:   { httpGet: { path: /health/startup, port: 5000 }, periodSeconds: 5, failureThreshold: 24 }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: default }
spec:
  selector: { app: auth-service }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey-service
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: survey-service } }
  template:
    metadata: { labels: { app: survey-service } }
    spec:
      containers:
      - name: survey-service
        image: __REGISTRY__/survey-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080 }]
        envFrom:
        - configMapRef: { name: survey-service-config }
        - secretRef: { name: survey-service-secrets }
        resources:
          requests: { memory: "96Mi", cpu: "50m" }
          limits: { memory: "192Mi", cpu: "1000m" }
        readinessProbe: { httpGet: { path: /health/ready, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /health/live,  port: 8080 }, initialDelaySeconds: 20, periodSeconds: 15 }
        startupProbe:   { httpGet: { path: /health/startup, port: 8080 }, periodSeconds: 5, failureThreshold: 24 }
---
apiVersion: v1
kind: Service
metadata: { name: survey-service, namespace: default }
spec:
  selector: { app: survey-service }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: participants-service
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: participants-service } }
  template:
    metadata: { labels: { app: participants-service } }
    spec:
      containers:
      - name: participants-service
        image: __REGISTRY__/participant-service:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8081 }]
        envFrom:
        - configMapRef: { name: participants-service-config }
        - secretRef: { name: participants-service-secrets }
        resources:
          requests: { memory: "96Mi", cpu: "50m" }
          limits: { memory: "192Mi", cpu: "1000m" }
        readinessProbe: { httpGet: { path: /health, port: 8081 }, initialDelaySeconds: 5, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /health, port: 8081 }, initialDelaySeconds: 20, periodSeconds: 15 }
        startupProbe:   { httpGet: { path: /health, port: 8081 }, periodSeconds: 5, failureThreshold: 24 }
