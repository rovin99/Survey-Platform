---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
      - name: frontend
        image: __REGISTRY__/frontend:latest
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 3000 }]
        envFrom:
        - configMapRef: { name: frontend-config }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits: { memory: "256Mi", cpu: "500m" }
        readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
        livenessProbe:  { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 30, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: default }
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
