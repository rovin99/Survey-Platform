apiVersion: v1
kind: ConfigMap
metadata:
  name: ngrok-proxy-config
  namespace: default
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        # Frontend proxy - accepts any hostname
        server {
            listen 8888;
            server_name _;
            
            # Proxy to frontend with correct Host header for Kourier
            location / {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_set_header Host "frontend.default.127.0.0.1.nip.io";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header Origin "https://trypanosomic-tamisha-imbricately.ngrok-free.dev";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok-proxy
  template:
    metadata:
      labels:
        app: ngrok-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8888
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: ngrok-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: ngrok-proxy
  namespace: default
spec:
  selector:
    app: ngrok-proxy
  ports:
  - port: 8888
    targetPort: 8888
  type: ClusterIP






