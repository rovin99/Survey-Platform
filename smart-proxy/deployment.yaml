# API Gateway for Survey Platform (Knative deployment)
# Routes all external traffic to the correct Knative service via Kourier
# This is the single entry point for the cluster (replaces nginx in docker-compose)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: default
  labels:
    app: api-gateway
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        client_max_body_size 6m;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        server {
            listen 80;
            server_name _;

            # Auth Service
            location /api/auth/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_pass_header Set-Cookie;
            }

            location /api/Conductor/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_pass_header Set-Cookie;
            }

            location /api/Participant/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_pass_header Set-Cookie;
            }

            location /api/SurveyProxy/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "auth-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Survey Management Service
            location /api/v1/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header User-Agent $http_user_agent;
                proxy_pass_header Set-Cookie;
            }

            location /api/surveys {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header User-Agent $http_user_agent;
            }

            location /api/answers {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/email/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "survey-management-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Participants Management Service
            location /api/participant/ {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "participants-management-service.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header User-Agent $http_user_agent;
                proxy_pass_header Set-Cookie;
            }

            # MinIO Object Storage (uploaded media)
            location /uploads/ {
                proxy_pass http://minio.storage.svc.cluster.local:9000/survey-uploads/;
                proxy_set_header Host minio.storage.svc.cluster.local:9000;
                expires 30d;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
            }

            # Piston Code Execution Engine
            location /api/piston/ {
                proxy_pass http://piston.default.svc.cluster.local:2000/api/v2/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_read_timeout 60s;
                proxy_connect_timeout 30s;
            }

            # Frontend (catch-all)
            location / {
                proxy_pass http://kourier.kourier-system.svc.cluster.local;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host "frontend.default.svc.cluster.local";
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            # Gateway health check
            location /gateway-health {
                return 200 '{"status":"ok"}';
                add_header Content-Type application/json;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /gateway-health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /gateway-health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: api-gateway-config

---
# LoadBalancer Service — the single entry point for external traffic
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: api-gateway
