# In-cluster nginx gateway (replicates infrastructure/nginx/nginx.conf for k3s) + Traefik Ingress.
# Differences from the compose nginx.conf: minio upstream uses the cross-namespace FQDN, and the
# Piston upstream/location are removed (Piston is not deployed; nginx would fail to resolve it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-conf
  namespace: default
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
        upstream frontend             { server frontend:3000; }
        upstream auth_service         { server auth-service:5000; }
        upstream survey_service       { server survey-service:8080; }
        upstream participants_service { server participants-service:8081; }
        upstream minio                { server minio.storage.svc.cluster.local:9000; }

        server {
            listen 80;
            server_name _;
            client_max_body_size 6m;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            location /uploads/ {
                proxy_pass http://minio/survey-uploads/;
                proxy_set_header Host $host;
                expires 30d;
                add_header Cache-Control "public, immutable";
            }

            location /api/auth        { proxy_pass http://auth_service;  include /etc/nginx/proxy_common.conf; }
            location /api/Conductor   { proxy_pass http://auth_service;  include /etc/nginx/proxy_common.conf; }
            location /api/Participant { proxy_pass http://participants_service; include /etc/nginx/proxy_common.conf; }

            location /api/surveys { proxy_pass http://survey_service; include /etc/nginx/proxy_common.conf; }
            location /api/v1      { proxy_pass http://survey_service; include /etc/nginx/proxy_common.conf; }
            location /api/answers { proxy_pass http://survey_service; include /etc/nginx/proxy_common.conf; }
            location /api/email   { proxy_pass http://survey_service; include /etc/nginx/proxy_common.conf; }

            location /api/participant { proxy_pass http://participants_service; include /etc/nginx/proxy_common.conf; }

            location / {
                proxy_pass http://frontend;
                include /etc/nginx/proxy_common.conf;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }
        }
    }
  proxy_common.conf: |
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;
    proxy_pass_header Set-Cookie;
    proxy_cookie_path / /;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: survey-gateway
  namespace: default
spec:
  replicas: 1
  selector: { matchLabels: { app: survey-gateway } }
  template:
    metadata: { labels: { app: survey-gateway } }
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports: [{ containerPort: 80 }]
        volumeMounts:
        - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
        - { name: conf, mountPath: /etc/nginx/proxy_common.conf, subPath: proxy_common.conf }
        resources:
          requests: { memory: "32Mi", cpu: "50m" }
          limits: { memory: "64Mi", cpu: "300m" }
        readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
      volumes:
      - name: conf
        configMap: { name: gateway-nginx-conf }
---
apiVersion: v1
kind: Service
metadata: { name: survey-gateway, namespace: default }
spec:
  selector: { app: survey-gateway }
  ports: [{ port: 80, targetPort: 80 }]
---
# Traefik (k3s default ingress, :80) → nginx gateway. Catch-all host so it serves on the VM IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: survey-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: survey-gateway
            port:
              number: 80
