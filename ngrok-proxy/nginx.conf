events {
    worker_connections 1024;
}

http {
    # Frontend proxy - default catch-all
    server {
        listen 80 default_server;
        server_name _;
        
        location / {
            proxy_pass http://frontend.default.svc.cluster.local;
            proxy_set_header Host "frontend.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Origin "https://trypanosomic-tamisha-imbricately.ngrok-free.dev";
        }
    }
}






