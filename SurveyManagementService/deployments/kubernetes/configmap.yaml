apiVersion: v1
kind: ConfigMap
metadata:
  name: survey-service-config
  namespace: default
  labels:
    app: survey-management-service
data:
  # Application Environment
  ENVIRONMENT: "production"

  # Database Configuration (non-sensitive)
  DB_HOST: "postgres-db.database.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "SurveyDb"
  DB_SSLMODE: "require"

  # Service Port
  PORT: "8080"

  # JWT Configuration (non-sensitive parts — secret key is in secrets.template.yaml)
  JWT_ISSUER: "AuthService"
  JWT_AUDIENCE: "SurveyApp"

  # Inter-service communication
  AUTH_SERVICE_URL: "http://auth-service.default.svc.cluster.local"

  # MinIO Object Storage
  MINIO_ENDPOINT: "minio.storage.svc.cluster.local:9000"
  MINIO_BUCKET: "survey-uploads"
  MINIO_USE_SSL: "false"

  # Frontend URL (used for invitation email links)
  # Replace with your actual production domain
  FRONTEND_URL: "https://your-production-domain.com"

  # CORS Configuration (replace with your production domain)
  CORS_ORIGINS: "https://your-production-domain.com"

  # Timezone
  TZ: "UTC"
