events {
    worker_connections 1024;
}

http {
    # Allow file uploads up to 6MB (for image uploads)
    client_max_body_size 6m;

    # Increase buffer sizes for large headers (JWT tokens)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 80;
        server_name _;

        # --- Auth Service routes ---
        location /api/auth/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "auth-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /api/Conductor/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "auth-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /api/Participant/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "auth-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }

        location /api/SurveyProxy/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "auth-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Survey Management Service routes ---
        location /api/v1/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "survey-management-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header User-Agent $http_user_agent;
            proxy_pass_header Set-Cookie;
        }

        location /api/surveys {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "survey-management-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header User-Agent $http_user_agent;
        }

        location /api/answers {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "survey-management-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/email/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "survey-management-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Participants Management Service routes ---
        location /api/participant/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "participants-management-service.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header User-Agent $http_user_agent;
            proxy_pass_header Set-Cookie;
        }

        # --- MinIO Object Storage (uploaded media files) ---
        location /uploads/ {
            proxy_pass http://minio.storage.svc.cluster.local:9000/survey-uploads/;
            proxy_set_header Host minio.storage.svc.cluster.local:9000;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        # --- Piston Code Execution Engine ---
        location /api/piston/ {
            proxy_pass http://piston.default.svc.cluster.local:2000/api/v2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
        }

        # --- Frontend (catch-all) ---
        location / {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host "frontend.default.svc.cluster.local";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Health check endpoint for the gateway itself
        location /gateway-health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
