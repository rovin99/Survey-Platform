events {
    worker_connections 1024;
}

http {
    server {
        listen 9000;
        server_name _;
        
        # Route API calls to correct backend services based on path
        location /api/auth/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location /api/Conductor/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location /api/Participant/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "auth-service.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location /api/surveys {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "survey-management-service.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location /api/answers {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "survey-management-service.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location /api/participant/ {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "participants-management-service.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        # Default: everything else goes to frontend
        location / {
            proxy_pass http://kourier.kourier-system.svc.cluster.local;
            proxy_set_header Host "frontend.default.127.0.0.1.nip.io";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}

