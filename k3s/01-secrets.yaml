# Secrets for all services. DEV/TEST values — CHANGE before any real use.
# JWT_SECRET_KEY and INTERNAL_API_KEY MUST be identical across all three services.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: database
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres123"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: storage
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: default
type: Opaque
stringData:
  CONNECTION_STRING: "Host=postgres-db.database.svc.cluster.local;Port=5432;Database=SurveyDb;Username=postgres;Password=postgres123"
  JWT_KEY: "survey-platform-jwt-secret-key-change-this-in-production-min-32-chars"
  JWT_ISSUER: "AuthService"
  JWT_AUDIENCE: "SurveyApp"
  JWT_DURATION: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: survey-service-secrets
  namespace: default
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres123"
  JWT_SECRET_KEY: "survey-platform-jwt-secret-key-change-this-in-production-min-32-chars"
  INTERNAL_API_KEY: "internal-service-key-change-me"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  EMAIL: "your-email@gmail.com"
  APP_PASS: "your-gmail-app-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: participants-service-secrets
  namespace: default
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres123"
  JWT_SECRET_KEY: "survey-platform-jwt-secret-key-change-this-in-production-min-32-chars"
  INTERNAL_API_KEY: "internal-service-key-change-me"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
