apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: participants-management-service
  namespace: default
  labels:
    app: participants-management-service
    version: v1
spec:
  template:
    metadata:
      annotations:
        # Autoscaling configuration
        autoscaling.knative.dev/target: "10"                    # Target concurrent requests per pod
        autoscaling.knative.dev/minScale: "0"                   # Allow scale to zero
        autoscaling.knative.dev/maxScale: "15"                  # Maximum number of pods
        autoscaling.knative.dev/scaleDownDelay: "30s"           # Time to wait before scaling down
        autoscaling.knative.dev/window: "60s"                   # Window for averaging metrics

        # Additional annotations for observability
        run.googleapis.com/execution-environment: gen2         # For Google Cloud Run

      labels:
        app: participants-management-service
        version: v1

    spec:
      # Container configuration
      containers:
      - name: participants-service
        # Application image
        image: rovin123/participants-management-service:v1

        # Enhanced security context for Knative
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

        # Volume mounts for writable directories (due to read-only filesystem)
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: var-tmp-volume
          mountPath: /var/tmp
        - name: app-tmp-volume
          mountPath: /tmp/app
        - name: app-var-tmp-volume
          mountPath: /var/tmp/app
        - name: app-logs-volume
          mountPath: /app/logs

        # Port configuration - Knative standard
        ports:
        - containerPort: 8080
          protocol: TCP

        # Environment variables from ConfigMap and Secret
        envFrom:
          - configMapRef:
              name: participants-service-config
          - secretRef:
              name: participants-service-secrets

        # Resource limits and requests for Go service
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

        # Health checks for Knative probes
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Startup probe for slower startup times (database connections)
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12

      # Volumes for security context with read-only root filesystem
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: var-tmp-volume
        emptyDir: {}
      - name: app-tmp-volume
        emptyDir: {}
      - name: app-var-tmp-volume
        emptyDir: {}
      - name: app-logs-volume
        emptyDir: {}
      # Container concurrency for Go service (Fiber handles concurrency well)
      containerConcurrency: 20
